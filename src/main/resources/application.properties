spring.application.name=sistema-pedidos

# Configuración MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_pedidos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Propiedades de Seguridad JWT
jwt.secret=ClaveSecretaSuperSeguraParaOrderSystemGestionPedidos2026!
jwt.expiration=86400000