<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar Flotante Izquierdo -->
        <div id="sidebar" class="d-flex flex-column p-3 text-white">
            <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <i class="bi bi-box-seam text-warning fs-4 me-2"></i>
                <span class="fs-5 fw-bold">OrderSystem</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" id="nav-products" class="nav-link active">
                        <i class="bi bi-grid me-2"></i>Inventario
                    </a>
                </li>
                <li>
                    <a href="#" id="nav-orders" class="nav-link">
                        <i class="bi bi-cart me-2"></i>Pedidos
                    </a>
                </li>
            </ul>
            <hr>
            <div class="d-flex align-items-center justify-content-between px-2">
                <div>
                    <span class="d-block text-muted style-small" style="font-size: 0.75rem;">Rol actual:</span>
                    <strong id="user-role-badge" class="badge bg-secondary">Cargando...</strong>
                </div>
                <button id="btn-logout" class="btn btn-outline-danger btn-sm" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Vista Dinámica del Dashboard -->
        <div class="main-content">
            <div id="view-container"></div>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
