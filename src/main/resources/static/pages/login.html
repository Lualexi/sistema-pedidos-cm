<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - OrderSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { width: 100%; max-width: 400px; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="card card-login shadow-sm border-0 p-4">
        <div class="text-center mb-4">
            <i class="bi bi-box-seam text-primary display-4"></i>
            <h4 class="fw-bold mt-2">OrderSystem</h4>
            <p class="text-muted small">Ingresa tus credenciales para acceder</p>
        </div>

        <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" id="username" class="form-control" required placeholder="Ej. admin">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertError = document.getElementById('alert-error');
            alertError.classList.add('d-none');

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Usuario o contraseña incorrectos');

                const data = await res.json();
                // Guardar Token JWT y Rol
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                
                // Redirigir al Dashboard principal
                window.location.href = '/index.html';
            } catch (err) {
                alertError.textContent = err.message;
                alertError.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
